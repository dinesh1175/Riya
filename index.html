<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',sans-serif;background:#1a0a14;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;}

#gate{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:520px;width:100%;padding:2rem;text-align:center;transition:opacity 0.5s;}
#main-page{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:520px;width:100%;padding:2rem;text-align:center;}

.title-tag{font-size:0.7rem;letter-spacing:0.25em;text-transform:uppercase;color:#f4a0b0;border:1px solid rgba(244,160,176,0.35);padding:0.4rem 1.2rem;border-radius:999px;margin-bottom:1.5rem;}
.question{font-size:clamp(1.3rem,4vw,2rem);font-weight:700;line-height:1.4;color:#fff;margin-bottom:0.5rem;}
.sub{font-size:0.85rem;color:rgba(255,255,255,0.4);margin-bottom:2.5rem;}

.btns{display:flex;gap:1.2rem;justify-content:center;flex-wrap:wrap;}
.btn-yes{background:linear-gradient(135deg,#f4a0b0,#f5c842);border:none;border-radius:999px;color:#1a0a14;font-size:1rem;font-weight:700;padding:0.9rem 2.6rem;cursor:pointer;letter-spacing:0.05em;transition:transform 0.2s,box-shadow 0.2s;}
.btn-yes:hover{transform:scale(1.07);}
.btn-no{background:transparent;border:1.5px solid rgba(255,255,255,0.2);border-radius:999px;color:rgba(255,255,255,0.6);font-size:1rem;padding:0.9rem 2.6rem;cursor:pointer;letter-spacing:0.05em;transition:all 0.2s;}
.btn-no:hover{border-color:rgba(255,100,100,0.5);color:#ff8080;}

#char-wrap{margin:0 auto 1.5rem;width:140px;height:160px;position:relative;}

#reaction-msg{min-height:3.5rem;font-size:1rem;line-height:1.6;color:rgba(255,255,255,0.8);margin-bottom:1.5rem;transition:opacity 0.3s;}

.star{position:absolute;font-size:1.4rem;pointer-events:none;animation:starPop 0.6s ease forwards;}
@keyframes starPop{0%{opacity:0;transform:scale(0) rotate(0deg);}60%{opacity:1;transform:scale(1.3) rotate(20deg);}100%{opacity:0;transform:scale(0.8) rotate(40deg) translateY(-30px);}}

@keyframes jumpHappy{0%,100%{transform:translateY(0);}20%{transform:translateY(-40px) rotate(-8deg);}40%{transform:translateY(-55px) rotate(8deg);}60%{transform:translateY(-30px) rotate(-5deg);}80%{transform:translateY(-15px) rotate(3deg);}90%{transform:translateY(-5px);}}
@keyframes shakeAngry{0%,100%{transform:translateX(0);}10%{transform:translateX(-8px) rotate(-4deg);}20%{transform:translateX(8px) rotate(4deg);}30%{transform:translateX(-10px) rotate(-5deg);}40%{transform:translateX(10px) rotate(5deg);}50%{transform:translateX(-6px);}60%{transform:translateX(6px);}70%{transform:translateX(-4px);}80%{transform:translateX(4px);}90%{transform:translateX(-2px);}}
@keyframes idleBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}

.char-svg{width:140px;height:160px;}

.steam{animation:steamRise 0.8s ease infinite alternate;}
@keyframes steamRise{0%{transform:translateY(0) scaleX(1);opacity:0.8;}100%{transform:translateY(-8px) scaleX(1.3);opacity:0;}}

.main-card{background:rgba(255,255,255,0.04);border:1px solid rgba(244,160,176,0.2);border-radius:24px;padding:2.5rem 3rem;max-width:440px;animation:fadeSlideUp 0.7s ease both;}
.main-name{font-size:clamp(2.5rem,10vw,4.5rem);font-weight:900;background:linear-gradient(135deg,#fff,#f4a0b0,#f5c842);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
.main-sub{font-size:0.9rem;color:rgba(255,255,255,0.45);margin-top:0.6rem;font-style:italic;}
.open-btn{margin-top:2rem;background:linear-gradient(135deg,#f4a0b0,#e06080);border:none;border-radius:999px;color:#fff;font-size:1rem;font-weight:700;padding:0.9rem 2.8rem;cursor:pointer;letter-spacing:0.06em;transition:transform 0.2s;}
.open-btn:hover{transform:scale(1.05);}
</style>

<div id="gate">
  <div class="title-tag">Wait... before you enter ✋</div>

  <div id="char-wrap">
    <svg class="char-svg" id="char" viewBox="0 0 140 160" xmlns="http://www.w3.org/2000/svg">
      <g id="char-body" style="animation:idleBob 1.8s ease-in-out infinite;">
        <ellipse cx="70" cy="148" rx="28" ry="7" fill="rgba(0,0,0,0.25)"/>
        <rect id="body" x="42" y="88" width="56" height="52" rx="14" fill="#f4a0b0"/>
        <rect id="shirt-stripe" x="42" y="104" width="56" height="8" fill="#e06080" rx="0"/>
        <line x1="70" y1="88" x2="70" y2="140" stroke="#e06080" stroke-width="2" opacity="0.4"/>
        <rect id="leg-l" x="50" y="136" width="16" height="22" rx="7" fill="#6b3fa0"/>
        <rect id="leg-r" x="74" y="136" width="16" height="22" rx="7" fill="#6b3fa0"/>
        <rect id="shoe-l" x="47" y="152" width="22" height="10" rx="5" fill="#2a0a20"/>
        <rect id="shoe-r" x="71" y="152" width="22" height="10" rx="5" fill="#2a0a20"/>
        <rect id="arm-l" x="20" y="90" width="24" height="12" rx="6" fill="#f4a0b0" transform="rotate(15,32,96)"/>
        <rect id="arm-r" x="96" y="90" width="24" height="12" rx="6" fill="#f4a0b0" transform="rotate(-15,108,96)"/>
        <circle cx="70" cy="72" r="26" fill="#fde4b0"/>
        <g id="face-happy">
          <circle cx="62" cy="68" r="3.5" fill="#2a0a20"/>
          <circle cx="78" cy="68" r="3.5" fill="#2a0a20"/>
          <circle cx="63.5" cy="66.5" r="1.2" fill="white"/>
          <circle cx="79.5" cy="66.5" r="1.2" fill="white"/>
          <path d="M62 77 Q70 85 78 77" stroke="#c04060" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <circle cx="62" cy="73" r="4" fill="#f4a0b0" opacity="0.4"/>
          <circle cx="78" cy="73" r="4" fill="#f4a0b0" opacity="0.4"/>
        </g>
        <g id="face-angry" style="display:none;">
          <circle cx="62" cy="68" r="3.5" fill="#2a0a20"/>
          <circle cx="78" cy="68" r="3.5" fill="#2a0a20"/>
          <circle cx="63.5" cy="66.5" r="1.2" fill="white"/>
          <circle cx="79.5" cy="66.5" r="1.2" fill="white"/>
          <line x1="57" y1="62" x2="67" y2="66" stroke="#c04060" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="83" y1="62" x2="73" y2="66" stroke="#c04060" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M63 78 Q70 73 77 78" stroke="#c04060" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <g id="steam-grp">
            <ellipse cx="58" cy="48" rx="4" ry="6" fill="#ff8080" opacity="0.7" class="steam" style="animation-delay:0s;"/>
            <ellipse cx="70" cy="44" rx="3.5" ry="5" fill="#ff8080" opacity="0.7" class="steam" style="animation-delay:0.25s;"/>
            <ellipse cx="82" cy="48" rx="4" ry="6" fill="#ff8080" opacity="0.7" class="steam" style="animation-delay:0.5s;"/>
          </g>
        </g>
        <g id="hair">
          <ellipse cx="70" cy="48" rx="26" ry="10" fill="#2a0a20"/>
          <ellipse cx="52" cy="56" rx="9" ry="14" fill="#2a0a20"/>
          <ellipse cx="88" cy="56" rx="9" ry="14" fill="#2a0a20"/>
          <rect x="44" y="46" width="52" height="10" rx="4" fill="#2a0a20"/>
        </g>
        <circle cx="84" cy="52" r="4" fill="#f5c842" opacity="0.9"/>
      </g>
    </svg>
  </div>

  <div class="question" id="q-text">Do you love your brother? 💝</div>
  <div class="sub" id="q-sub">Answer honestly, Riya... the website is watching 👀</div>

  <div id="reaction-msg" style="opacity:0;"></div>

  <div class="btns" id="btn-group">
    <button class="btn-yes" onclick="handleAnswer(true)">Yes, obviously! 💖</button>
    <button class="btn-no" onclick="handleAnswer(false)">No 😤</button>
  </div>
</div>

<div id="main-page">
  <div class="main-card">
    <div style="font-size:2.5rem;margin-bottom:0.8rem;">🎉</div>
    <div class="main-name">Riya</div>
    <div class="main-sub">dancer · dreamer · aesthetic soul · forever photoholic</div>
    <p style="margin-top:1.2rem;font-size:0.9rem;color:rgba(255,255,255,0.55);line-height:1.7;">Your birthday website is ready.<br>Made with way too much love. 💖</p>
	<button class="open-btn" onclick="window.location.href='main.html'">Open my birthday site ✨</button>
  </div>
</div>

<script>
const charBody = document.getElementById('char-body');
const faceHappy = document.getElementById('face-happy');
const faceAngry = document.getElementById('face-angry');
const reactionMsg = document.getElementById('reaction-msg');
const btnGroup = document.getElementById('btn-group');
const qText = document.getElementById('q-text');
const qSub = document.getElementById('q-sub');
const gate = document.getElementById('gate');
const mainPage = document.getElementById('main-page');

let noCount = 0;
let locked = false;

const noResponses = [
  { msg: "😐 Hmm... that answer is WRONG. Try again?", q: "Do you REALLY not love your brother? 🤨" },
  { msg: "😒 The website heard that. It's disappointed.\nAsk yourself again...", q: "Last chance. Do you love your brother? 💀" },
  { msg: "🤡 Okay you know what... I think you actually do.\nYou're just being difficult.", q: "Alright be honest. Do you love him or not? 👀" },
  { msg: "😤 Fine. FINE. I'll just tell you yourself — you do.\nNow press the right button.", q: "Say. Yes. 🫵" },
  { msg: "🙄 OK at this point you're literally just trolling.\nThe character is filing a complaint.", q: "DO YOU LOVE YOUR BROTHER??? 😭" },
];

function spawnStars() {
  const wrap = document.getElementById('char-wrap');
  const emojis = ['⭐','💫','✨','🌟','💖','🎉'];
  for(let i=0;i<7;i++){
    setTimeout(()=>{
      const el = document.createElement('div');
      el.className='star';
      el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      el.style.left = (10+Math.random()*120)+'px';
      el.style.top = (-10+Math.random()*60)+'px';
      el.style.animationDelay = (Math.random()*0.3)+'s';
      wrap.appendChild(el);
      setTimeout(()=>el.remove(),800);
    },i*80);
  }
}

function showReaction(msg){
  reactionMsg.style.opacity='0';
  setTimeout(()=>{
    reactionMsg.textContent=msg;
    reactionMsg.style.opacity='1';
  },200);
}

function handleAnswer(yes){
  if(locked) return;

  if(yes){
    locked=true;
    btnGroup.style.pointerEvents='none';
    faceHappy.style.display='block';
    faceAngry.style.display='none';
    charBody.style.animation='jumpHappy 1s ease forwards';
    spawnStars();
    showReaction('YAY!! She said yes!! 🎉💃✨');
    qText.textContent="Of course you do! 🥰";
    qSub.textContent="Opening your special surprise now...";
    btnGroup.style.display='none';

    setTimeout(()=>{
      gate.style.opacity='0';
      setTimeout(()=>{
        gate.style.display='none';
        mainPage.style.display='flex';
      },500);
    },2200);

  } else {
    faceHappy.style.display='none';
    faceAngry.style.display='block';
    charBody.style.animation='none';
    void charBody.offsetWidth;
    charBody.style.animation='shakeAngry 0.7s ease forwards';

    const idx = Math.min(noCount, noResponses.length-1);
    const resp = noResponses[idx];
    showReaction(resp.msg);
    qText.textContent = resp.q;
    qSub.textContent = "The character is NOT happy with you right now.";
    noCount++;

    setTimeout(()=>{
      charBody.style.animation='idleBob 1.8s ease-in-out infinite';
    }, 900);
  }
}
</script>
